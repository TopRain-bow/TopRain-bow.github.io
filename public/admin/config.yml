# ============================================================
# Sveltia CMS 配置 —— 站内写作后台 /admin
# 人类：浏览器打开 https://toprain-bow.github.io/admin/ 写文章
# AI 智能体：不需要走这个后台，直接改 src/content/posts/*.md 即可
# ============================================================

# 直接提交到 main（不经过 Editorial Workflow 的 PR 草稿流），
# 提交后 GitHub Actions 会自动构建并部署，约 1 分钟上线。
publish_mode: simple

backend:
  name: github
  repo: TopRain-bow/TopRain-bow.github.io
  branch: main

# 站点信息（后台右上角「查看网站」用）
site_url: https://toprain-bow.github.io
display_url: https://toprain-bow.github.io
logo_url: https://toprain-bow.github.io/favicon/firefly-32.png

# 中文界面（Sveltia 的语言包是 zh-CN，不是 Decap 的 zh_Hans）
locale: zh-CN

# 文章里插入图片时的落盘位置
media_folder: public/assets/images/posts
public_folder: /assets/images/posts

collections:
  - name: posts
    label: 文章
    label_singular: 文章
    description: 写在这里的文章会提交到仓库 src/content/posts/，Actions 自动发布。
    folder: src/content/posts
    create: true
    delete: true
    extension: md
    format: frontmatter
    # 用表单里的 slug 字段当文件名，保证网址是干净的英文
    slug: "{{fields.slug}}"
    preview_path: posts/{{fields.slug}}
    sortable_fields: [published, title]
    summary: "{{title}} — {{published}}"
    fields:
      - name: title
        label: 标题
        widget: string
        hint: 会显示在文章页和列表卡片上

      - name: slug
        label: 网址别名
        widget: string
        required: true
        pattern: ["^[a-z0-9]+(?:-[a-z0-9]+)*$", "只能用小写字母、数字和连字符，例如 my-first-post"]
        hint: 决定网址 /posts/xxx/ 和文件名，发布后不要再改，否则旧链接会 404

      - name: published
        label: 发布日期
        widget: datetime
        format: YYYY-MM-DD
        date_format: YYYY-MM-DD
        time_format: false
        picker_utc: true

      - name: category
        label: 分类
        widget: select
        required: false
        options:
          - 生活
          - 技术
          - 学习
          - 折腾
          - 随想
        hint: 新增分类要改本文件的 options 列表（同时告诉 AI 智能体这个约定）

      - name: tags
        label: 标签
        widget: list
        required: false
        default: []
        hint: 可多个，例如「随笔」「Astro」

      - name: description
        label: 摘要
        widget: text
        required: false
        hint: 一两句话，显示在列表卡片和搜索结果里

      - name: image
        label: 封面图
        widget: image
        required: false
        hint: 可留空。上传后路径会自动写成 /assets/images/posts/xxx

      - name: draft
        label: 草稿（不发布）
        widget: boolean
        required: false
        default: false

      - name: body
        label: 正文
        widget: markdown
